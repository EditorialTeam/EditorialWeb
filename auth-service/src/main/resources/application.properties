spring.application.name=auth-service
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.acks=all

#consumer
spring.kafka.consumer.group-id=editorial-auth-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.enable-auto-commit=false

#ouath2 resource server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8080/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=editorial-auth-service
spring.security.oauth2.resourceserver.jwt.audiences=editorial-api