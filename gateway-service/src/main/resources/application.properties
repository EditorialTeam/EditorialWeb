spring.application.name=gateway-service
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=auth-route
spring.cloud.gateway.server.webmvc.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/accounts/**

spring.cloud.gateway.server.webmvc.routes[1].id=article-route
spring.cloud.gateway.server.webmvc.routes[1].uri=http://article-service:8080
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/articles/**,/api/editor/articles/**

spring.cloud.gateway.server.webmvc.routes[2].id=user-route
spring.cloud.gateway.server.webmvc.routes[2].uri=http://user-service:8080
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/users/**,/api/admin/users/**

